name: Keybind
version: '${version}'
main: com.keybind.plugin.KeybindPlugin
api-version: '1.18'
description: Bind keys to server-side commands. Works with the Keybind client mod.
authors:
  - iM5LB

commands:
  kbind:
    description: Execute a keybind action or manage keybinds
    usage: /<command> <action|list|manage>
    permission: keybind.use

permissions:
  keybind.use:
    description: Allows using keybind actions
    default: true
  keybind.admin:
    description: Allows managing keybinds and reloading the config
    default: op
  keybind.bypass.cooldown:
    description: Bypass action cooldowns
    default: op
