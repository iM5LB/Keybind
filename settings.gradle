pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'keybind'

include 'common'
include 'plugin'
include 'fabric121'
include 'neoforge121'
include 'neoforge262'
include 'forge121'
include 'forge262'

if (providers.gradleProperty('includeForge12111').isPresent()) {
    include 'forge12111'
}

project(':fabric121').projectDir = file('fabric/1.21')
project(':neoforge121').projectDir = file('neoforge/1.21')
project(':neoforge262').projectDir = file('neoforge/26')
project(':forge121').projectDir = file('forge/1.21')
project(':forge262').projectDir = file('forge/26')

if (findProject(':forge12111') != null) {
    project(':forge12111').projectDir = file('forge/1.21.11')
}

includeBuild 'fabric/26'
