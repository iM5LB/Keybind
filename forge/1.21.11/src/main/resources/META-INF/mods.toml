modLoader="javafml"
loaderVersion="[${forge_min_version},)"
license="MIT"

[[mixins]]
config="keybind-mod.mixins.json"

[[mods]]
modId="keybind"
version="${version}"
displayName="Keybind"
description="Bind keys to server actions. Works with the Keybind server plugin."
displayTest="IGNORE_ALL_VERSION"

[[dependencies.keybind]]
modId="forge"
mandatory=true
versionRange="[${forge_min_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.keybind]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
